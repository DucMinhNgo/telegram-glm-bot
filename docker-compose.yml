version: "3.9"

services:
  glm:
    image: vllm/vllm-openai:latest
    container_name: glm-server
    runtime: nvidia
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN}
    ports:
      - "8801:8000"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    command: >
      --model ${GLM_MODEL}
      --host 0.0.0.0
      --port 8000
      --dtype auto
      --max-model-len 8192
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/models"]
      interval: 30s
      timeout: 10s
      retries: 10

  telegram-bot:
    build: ./bot
    container_name: telegram-glm-bot
    depends_on:
      glm:
        condition: service_healthy
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      OPENAI_BASE_URL: http://glm:8000/v1
      OPENAI_MODEL: ${GLM_MODEL}
    restart: unless-stopped
